[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shoppingshorts"
version = "0.1.0"
description = "Shopping shorts -> CapCut JSON video production agent"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "python-dotenv>=1",
]

[project.optional-dependencies]
analyze = [
    "yt-dlp>=2024.1",
    "scenedetect>=0.6",
    "faster-whisper>=1.0",
]
tts = [
    "elevenlabs>=1.0",
    "httpx>=0.27",
]
script = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8",
]

[project.scripts]
ss = "shoppingshorts.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
